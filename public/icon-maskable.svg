<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="fleetOpsMaskableIconTitle">
  <title id="fleetOpsMaskableIconTitle">Fleet Operations SL</title>
  <!-- Maskable icons must fill the canvas edge-to-edge (the OS applies its
       own mask shape) with all meaningful artwork kept inside the ~80%-
       diameter "safe zone" circle, per the PWA maskable-icon spec.
       Unlike icon.svg, no rounded corners here since the platform
       supplies its own mask. -->

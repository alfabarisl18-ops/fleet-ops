project_id = "fleet-ops"

[api]
enabled = true
port = 54321
# Only `public` is exposed. `app` and `app_private` hold the RLS helper
# functions and the PIN hashes, and must never appear in this list.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# Driver ID photographs and vehicle photos come off mid-range Android phones
# over metered data. The documents table enforces the same ceiling.
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# This is a private family business system. Accounts are created by the
# Owner/Admin in Settings, never by self-service signup.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = false
